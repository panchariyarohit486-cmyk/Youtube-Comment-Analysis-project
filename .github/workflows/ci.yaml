name: CI - DVC Pipeline & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/panchariyarohit486/youtube-sentiment-analysis.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote credentials
        run: |
          REMOTE_NAME=$(dvc remote list | head -n 1 | awk '{print $1}')
          if [ -z "$REMOTE_NAME" ]; then
            echo "No DVC remote configured in this repo. Skipping credential setup."
            exit 1
          fi
          echo "Using DVC remote: $REMOTE_NAME"
          dvc remote modify "$REMOTE_NAME" --local auth basic
          dvc remote modify "$REMOTE_NAME" --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify "$REMOTE_NAME" --local password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull DVC-tracked data and models
        run: dvc pull

      - name: Reproduce DVC pipeline
        run: dvc repro

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No tests directory found, skipping test step."
          fi

      - name: Show pipeline status
        if: always()
        run: dvc status